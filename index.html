<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>zhjpwlj Tools</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0a0e17;
            --secondary: #111827;
            --accent: #00d9ff;
            --accent-glow: rgba(0, 217, 255, 0.4);
            --accent-dark: #0088cc;
            --surface: rgba(30, 41, 59, 0.7);
            --surface-light: rgba(51, 65, 85, 0.5);
            --text-primary: #ffffff;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --border: rgba(255, 255, 255, 0.1);
            --success: #00ff9d;
            --danger: #ff4d6d;
            --warning: #ffbd59;
            --glass-bg: rgba(10, 14, 23, 0.85);
            --glass-border: rgba(255, 255, 255, 0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--primary);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(0, 217, 255, 0.05) 0%, transparent 20%),
                radial-gradient(circle at 90% 80%, rgba(0, 217, 255, 0.05) 0%, transparent 20%),
                linear-gradient(135deg, #0a0e17 0%, #0f172a 100%);
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 20px;
            position: relative;
            z-index: 2;
        }

        /* Futuristic header */
        .main-header {
            padding: 40px 0 30px;
            position: relative;
            text-align: center;
        }

        .header-glow {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, var(--accent-glow) 0%, transparent 70%);
            filter: blur(60px);
            z-index: -1;
            opacity: 0.4;
        }

        .logo {
            display: inline-flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
            position: relative;
        }

        .logo-icon {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, var(--accent), var(--accent-dark));
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            box-shadow: 0 0 30px var(--accent-glow);
            animation: pulse 4s infinite alternate;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 20px var(--accent-glow); }
            100% { box-shadow: 0 0 40px var(--accent-glow); }
        }

        h1 {
            font-family: 'Exo 2', sans-serif;
            font-size: 3.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, #ffffff, var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        .subtitle {
            font-size: 1.2rem;
            color: var(--text-secondary);
            max-width: 600px;
            margin: 0 auto 40px;
            line-height: 1.6;
        }

        /* Search bar */
        .search-container {
            max-width: 600px;
            margin: 0 auto 50px;
            position: relative;
        }

        .search-wrapper {
            position: relative;
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 4px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
        }

        .search-box {
            display: flex;
            align-items: center;
            padding: 16px 20px;
        }

        .search-icon {
            color: var(--accent);
            font-size: 20px;
            margin-right: 15px;
        }

        #search-input {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-primary);
            font-size: 16px;
            font-family: 'Inter', sans-serif;
        }

        #search-input::placeholder {
            color: var(--text-muted);
        }

        #search-input:focus {
            outline: none;
        }

        .search-hint {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        /* Categories */
        .categories {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            margin-bottom: 50px;
        }

        .category-btn {
            padding: 12px 24px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 50px;
            color: var(--text-secondary);
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.3s ease;
            font-family: 'Exo 2', sans-serif;
            letter-spacing: 0.5px;
        }

        .category-btn:hover {
            background: var(--surface-light);
            transform: translateY(-2px);
        }

        .category-btn.active {
            background: rgba(0, 217, 255, 0.1);
            border-color: var(--accent);
            color: var(--accent);
            box-shadow: 0 0 20px rgba(0, 217, 255, 0.2);
        }

        /* Tools grid */
        .tools-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 30px;
            margin-bottom: 60px;
        }

        .tool-card {
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 30px;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
        }

        .tool-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(0, 217, 255, 0.03) 0%, transparent 50%);
            z-index: -1;
        }

        .tool-card:hover {
            transform: translateY(-10px);
            border-color: rgba(0, 217, 255, 0.3);
            box-shadow: 
                0 15px 35px rgba(0, 0, 0, 0.3),
                0 0 0 1px rgba(0, 217, 255, 0.1);
        }

        .tool-header {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 20px;
        }

        .tool-icon {
            width: 70px;
            height: 70px;
            background: rgba(0, 217, 255, 0.1);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            flex-shrink: 0;
            border: 1px solid rgba(0, 217, 255, 0.2);
        }

        .tool-title-wrapper {
            flex: 1;
        }

        .tool-title {
            font-family: 'Exo 2', sans-serif;
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 5px;
            background: linear-gradient(90deg, #ffffff, var(--text-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .tool-category {
            display: inline-block;
            padding: 4px 12px;
            background: rgba(0, 217, 255, 0.1);
            color: var(--accent);
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .tool-description {
            color: var(--text-secondary);
            line-height: 1.7;
            margin-bottom: 25px;
            font-size: 0.95rem;
        }

        .tool-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .tool-link {
            padding: 12px 24px;
            background: linear-gradient(135deg, var(--accent), var(--accent-dark));
            color: var(--primary);
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
            font-family: 'Exo 2', sans-serif;
            letter-spacing: 0.5px;
        }

        .tool-link:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 217, 255, 0.3);
        }

        .tool-link i {
            transition: transform 0.3s ease;
        }

        .tool-link:hover i {
            transform: translateX(5px);
        }

        /* Empty state */
        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 80px 20px;
        }

        .empty-icon {
            font-size: 60px;
            color: var(--text-muted);
            margin-bottom: 25px;
            opacity: 0.5;
        }

        .empty-state h3 {
            font-family: 'Exo 2', sans-serif;
            font-size: 1.8rem;
            margin-bottom: 15px;
            color: var(--text-primary);
        }

        .empty-state p {
            color: var(--text-muted);
            max-width: 400px;
            margin: 0 auto;
            line-height: 1.6;
        }

        /* Footer */
        .main-footer {
            text-align: center;
            padding: 40px 20px;
            border-top: 1px solid var(--border);
            margin-top: 40px;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .footer-glow {
            height: 1px;
            width: 100%;
            background: linear-gradient(90deg, transparent, var(--accent), transparent);
            margin-bottom: 30px;
            opacity: 0.3;
        }

        /* Responsive */
        @media (max-width: 1200px) {
            .tools-grid {
                grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            }
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2.8rem;
            }
            
            .tools-grid {
                grid-template-columns: 1fr;
            }
            
            .categories {
                justify-content: flex-start;
                overflow-x: auto;
                padding-bottom: 15px;
            }
            
            .tool-header {
                flex-direction: column;
                text-align: center;
            }
            
            .tool-icon {
                width: 80px;
                height: 80px;
                font-size: 36px;
            }
        }

        @media (max-width: 480px) {
            h1 {
                font-size: 2.2rem;
            }
            
            .container {
                padding: 0 15px;
            }
            
            .tool-card {
                padding: 25px;
            }
            
            .tool-footer {
                flex-direction: column;
                gap: 15px;
                align-items: stretch;
            }
            
            .tool-link {
                justify-content: center;
            }
        }

        /* Particles background */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .particle {
            position: absolute;
            background: var(--accent);
            border-radius: 50%;
            opacity: 0.1;
        }

        /* Stats bar */
        .stats-bar {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-bottom: 40px;
            flex-wrap: wrap;
        }

        .stat-item {
            text-align: center;
        }

        .stat-value {
            font-family: 'Exo 2', sans-serif;
            font-size: 2.2rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent), #ffffff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1;
        }

        .stat-label {
            color: var(--text-secondary);
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <!-- Animated background particles -->
    <div class="particles" id="particles-container"></div>
    
    <div class="container">
        <header class="main-header">
            <div class="header-glow"></div>
            <div class="logo">
                <div class="logo-icon">
                    <i class="fas fa-infinity"></i>
                </div>
            </div>
            <h1>zhjpwlj Tools</h1>
            
            <div class="stats-bar">
                <div class="stat-item">
                    <div class="stat-value" id="total-tools">0</div>
                    <div class="stat-label">总工具数量</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="active-category-count">0</div>
                    <div class="stat-label">当前分类中的工具数量</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="categories-count">0</div>
                    <div class="stat-label">分类数量</div>
                </div>
            </div>
            
            <div class="search-container">
                <div class="search-wrapper">
                    <div class="search-box">
                        <div class="search-icon">
                            <i class="fas fa-search"></i>
                        </div>
                        <input type="text" id="search-input" placeholder="Search tools by name or description...">
                        <div class="search-hint">
                            <kbd>ESC</kbd> 清空
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="categories" id="categories-container">
                <!-- Categories will be populated by JavaScript -->
            </div>
        </header>
        
        <main>
            <div class="tools-grid" id="tools-container">
                <!-- Tools will be populated by JavaScript -->
            </div>
        </main>
        
        <footer class="main-footer">
            <div class="footer-glow"></div>
            <p>zhjpwlj Tools Interface &copy; <span id="current-year"></span> | Edit HTML to modify tools</p>
        </footer>
    </div>

    <script>
        // ======================
        // DATA CONFIGURATION
        // ======================
        // Edit this section to add, remove, or modify tools
        const categories = [
            { id: 'all', name: 'All Tools', emoji: '🌀', color: '#00d9ff' },
            { id: 'design', name: 'Design', emoji: '🎨', color: '#ff6b9d' },
            { id: 'development', name: 'Development', emoji: '💻', color: '#00ff9d' },
            { id: 'optimization', name: 'Optimization', emoji: '⚡', color: '#ffbd59' },
            { id: 'analysis', name: 'Analysis', emoji: '📊', color: '#9d4edd' },
            { id: 'utility', name: 'Utility', emoji: '🛠️', color: '#00c2ff' }
        ];

        const toolsData = [
            {
                id: 1,
                name: "Class Code Extractor",
                description: "Extract and organize CSS classes from HTML files. Useful for analyzing and refactoring codebases with precision.",
                link: "tools/class-code-extractor.html",
                category: "development",
                emoji: "🔍",
                featured: true
            },
            {
                id: 2,
                name: "Layout Designer",
                description: "Create and visualize responsive layouts with advanced drag-and-drop functionality and real-time preview.",
                link: "tools/layout-designer.html",
                category: "design",
                emoji: "🎨",
                featured: true
            }
        ];
        // ======================
        // APPLICATION CODE
        // ======================
        // No need to edit below this line for basic usage
        
        // DOM Elements
        const categoriesContainer = document.getElementById('categories-container');
        const toolsContainer = document.getElementById('tools-container');
        const searchInput = document.getElementById('search-input');
        const currentYear = document.getElementById('current-year');
        const particlesContainer = document.getElementById('particles-container');
        const totalToolsElement = document.getElementById('total-tools');
        const activeCategoryCountElement = document.getElementById('active-category-count');
        const categoriesCountElement = document.getElementById('categories-count');
        
        // State
        let activeCategory = 'all';
        let searchQuery = '';
        
        // Particle system variables
        let particles = [];
        let lines = [];
        let canvas;
        let ctx;
        let animationId;
        
        // SPEED SETTINGS - Adjust these to control animation speed
        const PARTICLE_SPEED_MULTIPLIER = 2.5;  // Increased from ~1.0
        const LINE_PULSE_SPEED = 0.15;          // Increased from 0.05
        const CONNECTION_CHANGE_RATE = 0.03;    // Increased from 0.01
        
        // Initialize the application
        document.addEventListener('DOMContentLoaded', () => {
            // Set current year in footer
            currentYear.textContent = new Date().getFullYear();
            
            // Initialize stats
            updateStats();
            
            // Initialize categories
            initCategories();
            
            // Initialize tools
            initTools();
            
            // Setup event listeners
            setupEventListeners();
            
            // Create canvas for particles and lines
            createCanvas();
            
            // Initialize particles and lines
            initParticleSystem();
            
            // Start animation
            animate();
        });
        
        // Create canvas for particles and lines
        function createCanvas() {
            // Remove existing canvas if any
            const existingCanvas = document.getElementById('particle-canvas');
            if (existingCanvas) {
                existingCanvas.remove();
            }
            
            // Create canvas
            canvas = document.createElement('canvas');
            canvas.id = 'particle-canvas';
            canvas.style.position = 'fixed';
            canvas.style.top = '0';
            canvas.style.left = '0';
            canvas.style.width = '100%';
            canvas.style.height = '100%';
            canvas.style.zIndex = '1';
            canvas.style.pointerEvents = 'none';
            document.body.appendChild(canvas);
            
            // Set canvas size
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);
            
            // Get context
            ctx = canvas.getContext('2d');
        }
        
        // Resize canvas to match window
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        
        // Initialize particle system
        function initParticleSystem() {
            particles = [];
            lines = [];
            
            // Create particles
            const particleCount = Math.random() * 500 ;
            
            for (let i = 0; i < particleCount; i++) {
                particles.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    vx: (Math.random() - 0.5) * 1.5 * PARTICLE_SPEED_MULTIPLIER,
                    vy: (Math.random() - 0.5) * 1.5 * PARTICLE_SPEED_MULTIPLIER,
                    radius: Math.random() * 2 + 1,
                    color: `rgba(0, 217, 255, ${Math.random() * 0.4 + 0.2})`,
                    glow: Math.random() * 0.15 + 0.1,
                    connections: [],
                    // Add some randomness to speed for variety
                    speedVariation: Math.random() * 0.5 + 0.75
                });
            }
            
            // Create initial lines
            createConnections();
        }
        
        // Create connections between particles
        function createConnections() {
            lines = [];
            const maxDistance = 180; // Increased connection range
            
            for (let i = 0; i < particles.length; i++) {
                particles[i].connections = [];
                
                for (let j = i + 1; j < particles.length; j++) {
                    const dx = particles[i].x - particles[j].x;
                    const dy = particles[i].y - particles[j].y;
                    const distance = Math.sqrt(dx * dx + dy * dy);
                    
                    if (distance < maxDistance) {
                        const line = {
                            from: i,
                            to: j,
                            width: Math.random() * 1.2 + 0.3, // Thicker lines
                            opacity: 0.4 * (1 - distance / maxDistance), // More visible
                            distance: distance,
                            active: true,
                            pulsePhase: Math.random() * Math.PI * 2,
                            pulseSpeed: Math.random() * 0.2 + 0.1 // Faster pulsing
                        };
                        
                        lines.push(line);
                        particles[i].connections.push(j);
                        particles[j].connections.push(i);
                    }
                }
            }
        }
        
        // Animation loop
        function animate() {
            // Clear canvas with a lighter fade effect for more motion blur
            ctx.fillStyle = 'rgba(10, 14, 23, 0.03)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Update and draw particles
            updateParticles();
            
            // Update and draw lines
            updateLines();
            
            // Randomly create/disconnect lines - increased frequency
            if (Math.random() < CONNECTION_CHANGE_RATE) {
                createRandomConnection();
            }
            
            if (Math.random() < CONNECTION_CHANGE_RATE * 0.6) {
                removeRandomConnection();
            }
            
            // Continue animation loop
            animationId = requestAnimationFrame(animate);
        }
        
        // Update particles with faster movement
        function updateParticles() {
            for (let i = 0; i < particles.length; i++) {
                const p = particles[i];
                
                // Apply speed variation
                const currentSpeed = PARTICLE_SPEED_MULTIPLIER * p.speedVariation;
                
                // Update position with higher speed
                p.x += p.vx * currentSpeed;
                p.y += p.vy * currentSpeed;
                
                // More aggressive edge bouncing
                if (p.x < 0) {
                    p.vx = Math.abs(p.vx) * (0.8 + Math.random() * 0.4);
                }
                if (p.x > canvas.width) {
                    p.vx = -Math.abs(p.vx) * (0.8 + Math.random() * 0.4);
                }
                if (p.y < 0) {
                    p.vy = Math.abs(p.vy) * (0.8 + Math.random() * 0.4);
                }
                if (p.y > canvas.height) {
                    p.vy = -Math.abs(p.vy) * (0.8 + Math.random() * 0.4);
                }
                
                // Keep within bounds with slight random variation
                p.x = Math.max(-10, Math.min(canvas.width + 10, p.x));
                p.y = Math.max(-10, Math.min(canvas.height + 10, p.y));
                
                // Draw particle with enhanced glow for faster movement effect
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                
                // More intense glow effect
                const gradient = ctx.createRadialGradient(
                    p.x, p.y, 0,
                    p.x, p.y, p.radius * 4
                );
                gradient.addColorStop(0, p.color);
                gradient.addColorStop(0.7, `rgba(0, 217, 255, ${p.glow * 0.5})`);
                gradient.addColorStop(1, 'rgba(0, 217, 255, 0)');
                
                ctx.fillStyle = gradient;
                ctx.fill();
                
                // Brighter core for fast-moving particles
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius * 0.8, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${0.4 + Math.random() * 0.2})`;
                ctx.fill();
                
                // Add motion trail for faster particles
                const speed = Math.sqrt(p.vx * p.vx + p.vy * p.vy);
                if (speed > 1) {
                    ctx.beginPath();
                    ctx.moveTo(p.x, p.y);
                    ctx.lineTo(p.x - p.vx * 0.5, p.y - p.vy * 0.5);
                    ctx.lineWidth = p.radius * 0.5;
                    ctx.strokeStyle = `rgba(0, 217, 255, ${0.2})`;
                    ctx.stroke();
                }
            }
        }
        
        // Update lines with faster pulsing
        function updateLines() {
            for (let i = 0; i < lines.length; i++) {
                const line = lines[i];
                
                // Update pulse animation faster
                line.pulsePhase += line.pulseSpeed * LINE_PULSE_SPEED * 3;
                const pulseValue = Math.sin(line.pulsePhase) * 0.7 + 0.3;
                
                // Get particle positions
                const p1 = particles[line.from];
                const p2 = particles[line.to];
                
                // Recalculate distance
                const dx = p1.x - p2.x;
                const dy = p1.y - p2.y;
                line.distance = Math.sqrt(dx * dx + dy * dy);
                
                // Remove lines that are too far apart (increased threshold)
                if (line.distance > 250) {
                    line.active = false;
                    continue;
                }
                
                // Calculate line opacity - more dynamic
                const baseOpacity = line.opacity * (0.8 + 0.4 * pulseValue);
                const distanceFactor = 1 - line.distance / 250;
                const opacity = baseOpacity * distanceFactor * (0.9 + 0.2 * Math.sin(Date.now() * 0.01));
                
                // Draw main line
                ctx.beginPath();
                ctx.moveTo(p1.x, p1.y);
                ctx.lineTo(p2.x, p2.y);
                ctx.lineWidth = line.width * (0.8 + 0.6 * pulseValue);
                ctx.strokeStyle = `rgba(0, 217, 255, ${opacity})`;
                ctx.lineCap = 'round';
                ctx.stroke();
                
                // Add brighter inner line for speed effect
                ctx.beginPath();
                ctx.moveTo(p1.x, p1.y);
                ctx.lineTo(p2.x, p2.y);
                ctx.lineWidth = line.width * (0.3 + 0.3 * pulseValue);
                ctx.strokeStyle = `rgba(255, 255, 255, ${opacity * 0.8})`;
                ctx.lineCap = 'round';
                ctx.stroke();
                
                // Add outer glow for faster appearance
                ctx.beginPath();
                ctx.moveTo(p1.x, p1.y);
                ctx.lineTo(p2.x, p2.y);
                ctx.lineWidth = line.width * (0.8 + 0.6 * pulseValue) + 4;
                ctx.strokeStyle = `rgba(0, 217, 255, ${opacity * 0.2})`;
                ctx.lineCap = 'round';
                ctx.stroke();
            }
            
            // Remove inactive lines
            lines = lines.filter(line => line.active);
            
            // More frequent line updates
            if (Math.random() < 0.02) {
                const randomLineIndex = Math.floor(Math.random() * lines.length);
                if (randomLineIndex < lines.length) {
                    const line = lines[randomLineIndex];
                    line.width = Math.random() * 1.2 + 0.3;
                    line.opacity = Math.random() * 0.4 + 0.2;
                }
            }
        }
        
        // Create random connection
        function createRandomConnection() {
            if (particles.length < 2) return;
            
            // Try more attempts for faster connections
            for (let attempts = 0; attempts < 20; attempts++) {
                const i = Math.floor(Math.random() * particles.length);
                const j = Math.floor(Math.random() * particles.length);
                
                if (i !== j && !particles[i].connections.includes(j)) {
                    const dx = particles[i].x - particles[j].x;
                    const dy = particles[i].y - particles[j].y;
                    const distance = Math.sqrt(dx * dx + dy * dy);
                    
                    if (distance < 200) { // Increased connection range
                        const line = {
                            from: i,
                            to: j,
                            width: Math.random() * 1.2 + 0.3,
                            opacity: 0.4 * (1 - distance / 200),
                            distance: distance,
                            active: true,
                            pulsePhase: Math.random() * Math.PI * 2,
                            pulseSpeed: Math.random() * 0.3 + 0.1
                        };
                        
                        lines.push(line);
                        particles[i].connections.push(j);
                        particles[j].connections.push(i);
                        break;
                    }
                }
            }
        }
        
        // Remove random connection
        function removeRandomConnection() {
            if (lines.length > 0) {
                const index = Math.floor(Math.random() * lines.length);
                const line = lines[index];
                
                // Remove from particles' connection lists
                const fromIndex = particles[line.from].connections.indexOf(line.to);
                const toIndex = particles[line.to].connections.indexOf(line.from);
                
                if (fromIndex !== -1) particles[line.from].connections.splice(fromIndex, 1);
                if (toIndex !== -1) particles[line.to].connections.splice(toIndex, 1);
                
                // Animate line disappearance
                line.active = false;
                
                // Remove line immediately for faster updates
                lines.splice(index, 1);
            }
        }
        
        // Update statistics
        function updateStats() {
            totalToolsElement.textContent = toolsData.length;
            categoriesCountElement.textContent = categories.length - 1; // Excluding "All"
            
            // Calculate active category count
            let activeCount = toolsData.length;
            if (activeCategory !== 'all') {
                activeCount = toolsData.filter(tool => tool.category === activeCategory).length;
            }
            if (searchQuery) {
                const query = searchQuery.toLowerCase();
                activeCount = toolsData.filter(tool => 
                    (activeCategory === 'all' || tool.category === activeCategory) &&
                    (tool.name.toLowerCase().includes(query) || 
                     tool.description.toLowerCase().includes(query))
                ).length;
            }
            activeCategoryCountElement.textContent = activeCount;
        }
        
        // Initialize categories
        function initCategories() {
            categoriesContainer.innerHTML = '';
            
            categories.forEach(category => {
                const button = document.createElement('button');
                button.className = `category-btn ${category.id === activeCategory ? 'active' : ''}`;
                button.dataset.category = category.id;
                button.style.borderColor = category.id === activeCategory ? category.color : '';
                button.innerHTML = `
                    <span class="category-emoji">${category.emoji}</span>
                    <span>${category.name}</span>
                `;
                
                button.addEventListener('click', () => {
                    // Update active category
                    activeCategory = category.id;
                    
                    // Update UI
                    document.querySelectorAll('.category-btn').forEach(btn => {
                        btn.classList.remove('active');
                        btn.style.borderColor = '';
                    });
                    button.classList.add('active');
                    button.style.borderColor = category.color;
                    
                    // Re-render tools
                    initTools();
                    updateStats();
                });
                
                categoriesContainer.appendChild(button);
            });
        }
        
        // Initialize tools
        function initTools() {
            toolsContainer.innerHTML = '';
            
            let filteredTools = [...toolsData];
            
            // Filter by category
            if (activeCategory !== 'all') {
                filteredTools = filteredTools.filter(tool => tool.category === activeCategory);
            }
            
            // Filter by search query
            if (searchQuery) {
                const query = searchQuery.toLowerCase();
                filteredTools = filteredTools.filter(tool => 
                    tool.name.toLowerCase().includes(query) || 
                    tool.description.toLowerCase().includes(query)
                );
            }
            
            // Display tools or empty state
            if (filteredTools.length === 0) {
                const emptyState = document.createElement('div');
                emptyState.className = 'empty-state';
                emptyState.innerHTML = `
                    <div class="empty-icon">
                        <i class="fas fa-search-minus"></i>
                    </div>
                    <h3>No tools found</h3>
                    <p>${searchQuery ? 'Try a different search term' : 'No tools available in this category'}</p>
                `;
                toolsContainer.appendChild(emptyState);
            } else {
                filteredTools.forEach(tool => {
                    const category = categories.find(c => c.id === tool.category);
                    const toolElement = createToolElement(tool, category);
                    toolsContainer.appendChild(toolElement);
                });
            }
            
            updateStats();
        }
        
        // Create tool element
        function createToolElement(tool, category) {
            const card = document.createElement('div');
            card.className = 'tool-card';
            
            // Convert hex color to rgb for rgba
            const hexToRgb = (hex) => {
                const r = parseInt(hex.slice(1, 3), 16);
                const g = parseInt(hex.slice(3, 5), 16);
                const b = parseInt(hex.slice(5, 7), 16);
                return `${r}, ${g}, ${b}`;
            };
            
            card.innerHTML = `
                <div class="tool-header">
                    <div class="tool-icon">${tool.emoji}</div>
                    <div class="tool-title-wrapper">
                        <h3 class="tool-title">${tool.name}</h3>
                        <div class="tool-category" style="background: rgba(${hexToRgb(category.color)}, 0.1); color: ${category.color}">${category.name}</div>
                    </div>
                </div>
                <p class="tool-description">${tool.description}</p>
                <div class="tool-footer">
                    <a href="${tool.link}" class="tool-link" target="_blank">
                        <span>Open Tool</span>
                        <i class="fas fa-arrow-right"></i>
                    </a>
                </div>
            `;
            
            return card;
        }
        
        // Setup event listeners
        function setupEventListeners() {
            // Search functionality
            searchInput.addEventListener('input', (e) => {
                searchQuery = e.target.value;
                initTools();
            });
            
            // Clear search on escape key
            searchInput.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    searchInput.value = '';
                    searchQuery = '';
                    initTools();
                }
            });
            
            // Reinitialize particles on window resize
            window.addEventListener('resize', () => {
                // Reset canvas size
                resizeCanvas();
                
                // Adjust particle positions
                for (let particle of particles) {
                    particle.x = Math.min(particle.x, canvas.width);
                    particle.y = Math.min(particle.y, canvas.height);
                }
                
                // Recreate connections
                createConnections();
            });
            
            // Add keyboard shortcuts for speed control (for debugging/development)
            document.addEventListener('keydown', (e) => {
                if (e.ctrlKey && e.key === ']') {
                    PARTICLE_SPEED_MULTIPLIER *= 1.2;
                    console.log(`Speed increased to: ${PARTICLE_SPEED_MULTIPLIER.toFixed(1)}x`);
                }
                if (e.ctrlKey && e.key === '[') {
                    PARTICLE_SPEED_MULTIPLIER *= 0.8;
                    console.log(`Speed decreased to: ${PARTICLE_SPEED_MULTIPLIER.toFixed(1)}x`);
                }
            });
        }
        
        // Clean up animation on page unload
        window.addEventListener('beforeunload', () => {
            if (animationId) {
                cancelAnimationFrame(animationId);
            }
        });
        
        // Log data structure for easy editing reference
        console.log('🔧 Nexus Tools Interface');
        console.log('To edit tools, modify the "toolsData" array in the JavaScript section.');
        console.log('All links are prefixed with "tools/" as requested.');
        console.log('Particle Speed: 2.5x (Press Ctrl+] to increase, Ctrl+[ to decrease)');
    </script>
</body>
</html>
