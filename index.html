<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>zhjpwlj Tools</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0a0e17;
            --secondary: #111827;
            --accent: #00d9ff;
            --accent-glow: rgba(0, 217, 255, 0.4);
            --accent-dark: #0088cc;
            --surface: rgba(30, 41, 59, 0.7);
            --surface-light: rgba(51, 65, 85, 0.5);
            --text-primary: #ffffff;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --border: rgba(255, 255, 255, 0.1);
            --success: #00ff9d;
            --danger: #ff4d6d;
            --warning: #ffbd59;
            --glass-bg: rgba(10, 14, 23, 0.85);
            --glass-border: rgba(255, 255, 255, 0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--primary);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(0, 217, 255, 0.05) 0%, transparent 20%),
                radial-gradient(circle at 90% 80%, rgba(0, 217, 255, 0.05) 0%, transparent 20%),
                linear-gradient(135deg, #0a0e17 0%, #0f172a 100%);
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 20px;
            position: relative;
            z-index: 2;
        }

        /* Futuristic header */
        .main-header {
            padding: 40px 0 30px;
            position: relative;
            text-align: center;
        }

        .header-glow {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, var(--accent-glow) 0%, transparent 70%);
            filter: blur(60px);
            z-index: -1;
            opacity: 0.4;
        }

        .logo {
            display: inline-flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
            position: relative;
        }

        .logo-icon {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, var(--accent), var(--accent-dark));
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            box-shadow: 0 0 30px var(--accent-glow);
            animation: pulse 4s infinite alternate;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 20px var(--accent-glow); }
            100% { box-shadow: 0 0 40px var(--accent-glow); }
        }

        h1 {
            font-family: 'Exo 2', sans-serif;
            font-size: 3.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, #ffffff, var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        .subtitle {
            font-size: 1.2rem;
            color: var(--text-secondary);
            max-width: 600px;
            margin: 0 auto 40px;
            line-height: 1.6;
        }

        /* Search bar */
        .search-container {
            max-width: 600px;
            margin: 0 auto 50px;
            position: relative;
        }

        .search-wrapper {
            position: relative;
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 4px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
        }

        .search-box {
            display: flex;
            align-items: center;
            padding: 16px 20px;
        }

        .search-icon {
            color: var(--accent);
            font-size: 20px;
            margin-right: 15px;
        }

        #search-input {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-primary);
            font-size: 16px;
            font-family: 'Inter', sans-serif;
        }

        #search-input::placeholder {
            color: var(--text-muted);
        }

        #search-input:focus {
            outline: none;
        }

        .search-hint {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        /* Categories */
        .categories {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            margin-bottom: 50px;
        }

        .category-btn {
            padding: 12px 24px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 50px;
            color: var(--text-secondary);
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.3s ease;
            font-family: 'Exo 2', sans-serif;
            letter-spacing: 0.5px;
        }

        .category-btn:hover {
            background: var(--surface-light);
            transform: translateY(-2px);
        }

        .category-btn.active {
            background: rgba(0, 217, 255, 0.1);
            border-color: var(--accent);
            color: var(--accent);
            box-shadow: 0 0 20px rgba(0, 217, 255, 0.2);
        }

        /* Tools grid */
        .tools-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 30px;
            margin-bottom: 60px;
        }

        .tool-card {
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 30px;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
        }

        .tool-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(0, 217, 255, 0.03) 0%, transparent 50%);
            z-index: -1;
        }

        .tool-card:hover {
            transform: translateY(-10px);
            border-color: rgba(0, 217, 255, 0.3);
            box-shadow: 
                0 15px 35px rgba(0, 0, 0, 0.3),
                0 0 0 1px rgba(0, 217, 255, 0.1);
        }

        .tool-header {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 20px;
        }

        .tool-icon {
            width: 70px;
            height: 70px;
            background: rgba(0, 217, 255, 0.1);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            flex-shrink: 0;
            border: 1px solid rgba(0, 217, 255, 0.2);
        }

        .tool-title-wrapper {
            flex: 1;
        }

        .tool-title {
            font-family: 'Exo 2', sans-serif;
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 5px;
            background: linear-gradient(90deg, #ffffff, var(--text-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .tool-category {
            display: inline-block;
            padding: 4px 12px;
            background: rgba(0, 217, 255, 0.1);
            color: var(--accent);
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .tool-description {
            color: var(--text-secondary);
            line-height: 1.7;
            margin-bottom: 25px;
            font-size: 0.95rem;
        }

        .tool-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .tool-link {
            padding: 12px 24px;
            background: linear-gradient(135deg, var(--accent), var(--accent-dark));
            color: var(--primary);
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
            font-family: 'Exo 2', sans-serif;
            letter-spacing: 0.5px;
        }

        .tool-link:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 217, 255, 0.3);
        }

        .tool-link i {
            transition: transform 0.3s ease;
        }

        .tool-link:hover i {
            transform: translateX(5px);
        }

        /* Empty state */
        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 80px 20px;
        }

        .empty-icon {
            font-size: 60px;
            color: var(--text-muted);
            margin-bottom: 25px;
            opacity: 0.5;
        }

        .empty-state h3 {
            font-family: 'Exo 2', sans-serif;
            font-size: 1.8rem;
            margin-bottom: 15px;
            color: var(--text-primary);
        }

        .empty-state p {
            color: var(--text-muted);
            max-width: 400px;
            margin: 0 auto;
            line-height: 1.6;
        }

        /* Footer */
        .main-footer {
            text-align: center;
            padding: 40px 20px;
            border-top: 1px solid var(--border);
            margin-top: 40px;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .footer-glow {
            height: 1px;
            width: 100%;
            background: linear-gradient(90deg, transparent, var(--accent), transparent);
            margin-bottom: 30px;
            opacity: 0.3;
        }

        /* Responsive */
        @media (max-width: 1200px) {
            .tools-grid {
                grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            }
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2.8rem;
            }
            
            .tools-grid {
                grid-template-columns: 1fr;
            }
            
            .categories {
                justify-content: flex-start;
                overflow-x: auto;
                padding-bottom: 15px;
            }
            
            .tool-header {
                flex-direction: column;
                text-align: center;
            }
            
            .tool-icon {
                width: 80px;
                height: 80px;
                font-size: 36px;
            }
        }

        @media (max-width: 480px) {
            h1 {
                font-size: 2.2rem;
            }
            
            .container {
                padding: 0 15px;
            }
            
            .tool-card {
                padding: 25px;
            }
            
            .tool-footer {
                flex-direction: column;
                gap: 15px;
                align-items: stretch;
            }
            
            .tool-link {
                justify-content: center;
            }
        }

        /* Particles background */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .particle {
            position: absolute;
            background: var(--accent);
            border-radius: 50%;
            opacity: 0.1;
        }

        /* Stats bar */
        .stats-bar {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-bottom: 40px;
            flex-wrap: wrap;
        }

        .stat-item {
            text-align: center;
        }

        .stat-value {
            font-family: 'Exo 2', sans-serif;
            font-size: 2.2rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent), #ffffff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1;
        }

        .stat-label {
            color: var(--text-secondary);
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <!-- Animated background particles -->
    <div class="particles" id="particles-container"></div>
    
    <div class="container">
        <header class="main-header">
            <div class="header-glow"></div>
            <div class="logo">
                <div class="logo-icon">
                    <i class="fas fa-infinity"></i>
                </div>
            </div>
            <h1>zhjpwlj Tools</h1>
            
            <div class="stats-bar">
                <div class="stat-item">
                    <div class="stat-value" id="total-tools">0</div>
                    <div class="stat-label">总工具数量</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="active-category-count">0</div>
                    <div class="stat-label">当前分类中的工具数量</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="categories-count">0</div>
                    <div class="stat-label">分类数量</div>
                </div>
            </div>
            
            <div class="search-container">
                <div class="search-wrapper">
                    <div class="search-box">
                        <div class="search-icon">
                            <i class="fas fa-search"></i>
                        </div>
                        <input type="text" id="search-input" placeholder="Search tools by name or description...">
                        <div class="search-hint">
                            <kbd>ESC</kbd> 清空
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="categories" id="categories-container">
                <!-- Categories will be populated by JavaScript -->
            </div>
        </header>
        
        <main>
            <div class="tools-grid" id="tools-container">
                <!-- Tools will be populated by JavaScript -->
            </div>
        </main>
        
        <footer class="main-footer">
            <div class="footer-glow"></div>
            <p>zhjpwlj Tools Interface &copy; <span id="current-year"></span> | Edit HTML to modify tools</p>
        </footer>
    </div>

    <script>
        // ======================
        // DATA CONFIGURATION
        // ======================
        // Edit this section to add, remove, or modify tools
        const categories = [
            { id: 'all', name: 'All Tools', emoji: '🌀', color: '#00d9ff' },
            { id: 'design', name: 'Design', emoji: '🎨', color: '#ff6b9d' },
            { id: 'development', name: 'Development', emoji: '💻', color: '#00ff9d' },
            { id: 'optimization', name: 'Optimization', emoji: '⚡', color: '#ffbd59' },
            { id: 'analysis', name: 'Analysis', emoji: '📊', color: '#9d4edd' },
            { id: 'utility', name: 'Utility', emoji: '🛠️', color: '#00c2ff' }
        ];

        const toolsData = [
            {
                id: 1,
                name: "Class Code Extractor",
                description: "Extract and organize CSS classes from HTML files. Useful for analyzing and refactoring codebases with precision.",
                link: "tools/class-code-extractor.html",
                category: "development",
                emoji: "🔍",
                featured: true
            },
            {
                id: 2,
                name: "Layout Designer",
                description: "Create and visualize responsive layouts with advanced drag-and-drop functionality and real-time preview.",
                link: "tools/layout-designer.html",
                category: "design",
                emoji: "🎨",
                featured: true
            }
        ];

        // ======================
        // APPLICATION CODE
        // ======================
        // No need to edit below this line for basic usage
        
        // DOM Elements
        const categoriesContainer = document.getElementById('categories-container');
        const toolsContainer = document.getElementById('tools-container');
        const searchInput = document.getElementById('search-input');
        const currentYear = document.getElementById('current-year');
        const particlesContainer = document.getElementById('particles-container');
        const totalToolsElement = document.getElementById('total-tools');
        const activeCategoryCountElement = document.getElementById('active-category-count');
        const categoriesCountElement = document.getElementById('categories-count');
        
        // State
        let activeCategory = 'all';
        let searchQuery = '';
        
        // Initialize the application
        document.addEventListener('DOMContentLoaded', () => {
            // Set current year in footer
            currentYear.textContent = new Date().getFullYear();
            
            // Initialize stats
            updateStats();
            
            // Initialize categories
            initCategories();
            
            // Initialize tools
            initTools();
            
            // Setup event listeners
            setupEventListeners();
            
            // Create animated particles
            createParticles();
        });
        
        // Create animated background particles
        function createParticles() {
            const particleCount = Math.random() * 500;
            
            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                
                // Random size and position
                const size = Math.random() * 4 + 1;
                const posX = Math.random() * 100;
                const posY = Math.random() * 100;
                
                particle.style.width = `${size}px`;
                particle.style.height = `${size}px`;
                particle.style.left = `${posX}%`;
                particle.style.top = `${posY}%`;
                particle.style.opacity = Math.random() * 0.15 + 0.05;
                
                // Animation
                const duration = Math.random() * 20 + 10;
                particle.style.animation = `float ${duration}s infinite ease-in-out`;
                particle.style.animationDelay = `${Math.random() * 5}s`;
                
                // Add keyframes for floating animation
                if (!document.querySelector('#particle-animation')) {
                    const style = document.createElement('style');
                    style.id = 'particle-animation';
                    style.textContent = `
                        @keyframes float {
                            0%, 100% { transform: translate(0, 0) rotate(0deg); }
                            25% { transform: translate(${Math.random() * 20 - 10}px, ${Math.random() * 20 - 10}px) rotate(90deg); }
                            50% { transform: translate(${Math.random() * 20 - 10}px, ${Math.random() * 20 - 10}px) rotate(180deg); }
                            75% { transform: translate(${Math.random() * 20 - 10}px, ${Math.random() * 20 - 10}px) rotate(270deg); }
                        }
                    `;
                    document.head.appendChild(style);
                }
                
                particlesContainer.appendChild(particle);
            }
        }
        
        // Update statistics
        function updateStats() {
            totalToolsElement.textContent = toolsData.length;
            categoriesCountElement.textContent = categories.length - 1; // Excluding "All"
            
            // Calculate active category count
            let activeCount = toolsData.length;
            if (activeCategory !== 'all') {
                activeCount = toolsData.filter(tool => tool.category === activeCategory).length;
            }
            if (searchQuery) {
                const query = searchQuery.toLowerCase();
                activeCount = toolsData.filter(tool => 
                    (activeCategory === 'all' || tool.category === activeCategory) &&
                    (tool.name.toLowerCase().includes(query) || 
                     tool.description.toLowerCase().includes(query))
                ).length;
            }
            activeCategoryCountElement.textContent = activeCount;
        }
        
        // Initialize categories
        function initCategories() {
            categoriesContainer.innerHTML = '';
            
            categories.forEach(category => {
                const button = document.createElement('button');
                button.className = `category-btn ${category.id === activeCategory ? 'active' : ''}`;
                button.dataset.category = category.id;
                button.style.borderColor = category.id === activeCategory ? category.color : '';
                button.innerHTML = `
                    <span class="category-emoji">${category.emoji}</span>
                    <span>${category.name}</span>
                `;
                
                button.addEventListener('click', () => {
                    // Update active category
                    activeCategory = category.id;
                    
                    // Update UI
                    document.querySelectorAll('.category-btn').forEach(btn => {
                        btn.classList.remove('active');
                        btn.style.borderColor = '';
                    });
                    button.classList.add('active');
                    button.style.borderColor = category.color;
                    
                    // Re-render tools
                    initTools();
                    updateStats();
                });
                
                categoriesContainer.appendChild(button);
            });
        }
        
        // Initialize tools
        function initTools() {
            toolsContainer.innerHTML = '';
            
            let filteredTools = [...toolsData];
            
            // Filter by category
            if (activeCategory !== 'all') {
                filteredTools = filteredTools.filter(tool => tool.category === activeCategory);
            }
            
            // Filter by search query
            if (searchQuery) {
                const query = searchQuery.toLowerCase();
                filteredTools = filteredTools.filter(tool => 
                    tool.name.toLowerCase().includes(query) || 
                    tool.description.toLowerCase().includes(query)
                );
            }
            
            // Display tools or empty state
            if (filteredTools.length === 0) {
                const emptyState = document.createElement('div');
                emptyState.className = 'empty-state';
                emptyState.innerHTML = `
                    <div class="empty-icon">
                        <i class="fas fa-search-minus"></i>
                    </div>
                    <h3>No tools found</h3>
                    <p>${searchQuery ? 'Try a different search term' : 'No tools available in this category'}</p>
                `;
                toolsContainer.appendChild(emptyState);
            } else {
                filteredTools.forEach(tool => {
                    const category = categories.find(c => c.id === tool.category);
                    const toolElement = createToolElement(tool, category);
                    toolsContainer.appendChild(toolElement);
                });
            }
            
            updateStats();
        }
        
        // Create tool element
        function createToolElement(tool, category) {
            const card = document.createElement('div');
            card.className = 'tool-card';
            
            card.innerHTML = `
                <div class="tool-header">
                    <div class="tool-icon">${tool.emoji}</div>
                    <div class="tool-title-wrapper">
                        <h3 class="tool-title">${tool.name}</h3>
                        <div class="tool-category" style="background: rgba(${hexToRgb(category.color)}, 0.1); color: ${category.color}">${category.name}</div>
                    </div>
                </div>
                <p class="tool-description">${tool.description}</p>
                <div class="tool-footer">
                    <a href="${tool.link}" class="tool-link" target="_blank">
                        <span>Open Tool</span>
                        <i class="fas fa-arrow-right"></i>
                    </a>
                </div>
            `;
            
            return card;
        }
        
        // Helper function to convert hex to rgb
        function hexToRgb(hex) {
            const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
            return result ? 
                `${parseInt(result[1], 16)}, ${parseInt(result[2], 16)}, ${parseInt(result[3], 16)}` 
                : '0, 217, 255';
        }
        
        // Setup event listeners
        function setupEventListeners() {
            // Search functionality
            searchInput.addEventListener('input', (e) => {
                searchQuery = e.target.value;
                initTools();
            });
            
            // Clear search on escape key
            searchInput.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    searchInput.value = '';
                    searchQuery = '';
                    initTools();
                }
            });
        }
        
        // Log data structure for easy editing reference
        console.log('🔧 zhjpwlj Tools Interface');
        console.log('To edit tools, modify the "toolsData" array in the JavaScript section.');
    </script>
</body>
</html>
