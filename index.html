<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevTools Hub</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Sidebar for categories -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <div class="logo">
                <i class="fas fa-tools"></i>
                <h1>DevTools</h1>
            </div>
            <div class="search-box">
                <i class="fas fa-search"></i>
                <input type="text" id="search-input" placeholder="Search tools...">
            </div>
        </div>
        
        <nav class="category-nav">
            <ul id="category-list">
                <!-- Categories will be loaded here from data.js -->
            </ul>
        </nav>
        
        <div class="sidebar-footer">
            <button id="add-tool-btn" class="btn-add">
                <i class="fas fa-plus"></i> Add New Tool
            </button>
            <div class="theme-toggle">
                <span>Dark Mode</span>
                <label class="switch">
                    <input type="checkbox" id="theme-toggle" checked>
                    <span class="slider"></span>
                </label>
            </div>
        </div>
    </aside>

    <!-- Main content area -->
    <main class="main-content">
        <header class="main-header">
            <div class="header-content">
                <h2 id="current-category">All Tools</h2>
                <p id="category-count">0 tools available</p>
            </div>
            <div class="header-actions">
                <button id="edit-mode-btn" class="btn-icon" title="Edit Mode">
                    <i class="fas fa-edit"></i>
                </button>
                <button id="view-toggle" class="btn-icon" title="Toggle View">
                    <i class="fas fa-th-large"></i>
                </button>
            </div>
        </header>

        <div class="tools-container" id="tools-container">
            <!-- Tools will be loaded here from data.js -->
        </div>

        <!-- Add/Edit Tool Modal -->
        <div id="tool-modal" class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h3>Add New Tool</h3>
                    <button class="close-modal">&times;</button>
                </div>
                <form id="tool-form">
                    <div class="form-group">
                        <label for="tool-name">Tool Name</label>
                        <input type="text" id="tool-name" required>
                    </div>
                    <div class="form-group">
                        <label for="tool-description">Description</label>
                        <textarea id="tool-description" rows="3" required></textarea>
                    </div>
                    <div class="form-group">
                        <label for="tool-category">Category</label>
                        <select id="tool-category" required>
                            <!-- Categories will be populated from data.js -->
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="tool-link">Link</label>
                        <input type="text" id="tool-link" required>
                    </div>
                    <div class="form-group">
                        <label for="tool-icon">Emoji Icon</label>
                        <div class="emoji-selector">
                            <input type="text" id="tool-icon" placeholder="🎨" maxlength="2">
                            <div class="emoji-suggestions">
                                <span class="emoji-option" data-emoji="🎨">🎨</span>
                                <span class="emoji-option" data-emoji="⚡">⚡</span>
                                <span class="emoji-option" data-emoji="🔧">🔧</span>
                                <span class="emoji-option" data-emoji="📊">📊</span>
                                <span class="emoji-option" data-emoji="🎯">🎯</span>
                                <span class="emoji-option" data-emoji="💻">💻</span>
                            </div>
                        </div>
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn-primary">Save Tool</button>
                        <button type="button" class="btn-secondary close-modal">Cancel</button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <!-- Data file (external) -->
    <script src="data.js"></script>
    <!-- Main JavaScript -->
    <script src="script.js"></script>
</body>
</html>
