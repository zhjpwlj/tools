<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Tools - ネクサスツール - 工具导航</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500&family=Noto+Sans+JP:wght@300;400;500;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0a0e17;
            --secondary: #111827;
            --accent: #00d9ff;
            --accent-glow: rgba(0, 217, 255, 0.4);
            --accent-dark: #0088cc;
            --surface: rgba(30, 41, 59, 0.7);
            --surface-light: rgba(51, 65, 85, 0.5);
            --text-primary: #ffffff;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --border: rgba(255, 255, 255, 0.1);
            --success: #00ff9d;
            --danger: #ff4d6d;
            --warning: #ffbd59;
            --glass-bg: rgba(10, 14, 23, 0.85);
            --glass-border: rgba(255, 255, 255, 0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--primary);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(0, 217, 255, 0.05) 0%, transparent 20%),
                radial-gradient(circle at 90% 80%, rgba(0, 217, 255, 0.05) 0%, transparent 20%),
                linear-gradient(135deg, #0a0e17 0%, #0f172a 100%);
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 20px;
            position: relative;
            z-index: 2;
        }

        /* Language selector */
        .language-selector {
            position: absolute;
            top: 30px;
            right: 30px;
            z-index: 100;
        }

        .language-dropdown {
            position: relative;
            display: inline-block;
        }

        .language-btn {
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 10px 20px;
            color: var(--text-primary);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            font-family: 'Exo 2', sans-serif;
            font-weight: 500;
            letter-spacing: 0.5px;
            transition: all 0.3s ease;
        }

        .language-btn:hover {
            border-color: var(--accent);
            transform: translateY(-2px);
        }

        .language-flag {
            font-size: 1.2rem;
        }

        .language-options {
            position: absolute;
            top: 100%;
            right: 0;
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 10px;
            margin-top: 5px;
            min-width: 200px;
            display: none;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            z-index: 1000;
        }

        .language-dropdown:hover .language-options {
            display: block;
        }

        .language-option {
            padding: 12px 16px;
            color: var(--text-primary);
            cursor: pointer;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: all 0.3s ease;
        }

        .language-option:hover {
            background: rgba(0, 217, 255, 0.1);
        }

        .language-option.active {
            background: rgba(0, 217, 255, 0.2);
            color: var(--accent);
        }

        /* Futuristic header */
        .main-header {
            padding: 40px 0 30px;
            position: relative;
            text-align: center;
        }

        .header-glow {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, var(--accent-glow) 0%, transparent 70%);
            filter: blur(60px);
            z-index: -1;
            opacity: 0.4;
        }

        .logo {
            display: inline-flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
            position: relative;
        }

        .logo-icon {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, var(--accent), var(--accent-dark));
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            box-shadow: 0 0 30px var(--accent-glow);
            animation: pulse 4s infinite alternate;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 20px var(--accent-glow); }
            100% { box-shadow: 0 0 40px var(--accent-glow); }
        }

        h1 {
            font-family: 'Exo 2', sans-serif;
            font-size: 3.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, #ffffff, var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        .subtitle {
            font-size: 1.2rem;
            color: var(--text-secondary);
            max-width: 600px;
            margin: 0 auto 40px;
            line-height: 1.6;
        }

        /* Language-specific fonts */
        body[data-language="ja"] .tool-title,
        body[data-language="ja"] .tool-description,
        body[data-language="ja"] .category-name {
            font-family: 'Noto Sans JP', 'Inter', sans-serif;
        }

        body[data-language="zh"] .tool-title,
        body[data-language="zh"] .tool-description,
        body[data-language="zh"] .category-name {
            font-family: 'Noto Sans SC', 'Inter', sans-serif;
        }

        /* Search bar */
        .search-container {
            max-width: 600px;
            margin: 0 auto 50px;
            position: relative;
        }

        .search-wrapper {
            position: relative;
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 4px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
        }

        .search-box {
            display: flex;
            align-items: center;
            padding: 16px 20px;
        }

        .search-icon {
            color: var(--accent);
            font-size: 20px;
            margin-right: 15px;
        }

        #search-input {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-primary);
            font-size: 16px;
            font-family: 'Inter', sans-serif;
        }

        #search-input::placeholder {
            color: var(--text-muted);
        }

        #search-input:focus {
            outline: none;
        }

        .search-hint {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        /* Categories */
        .categories {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            margin-bottom: 50px;
        }

        .category-btn {
            padding: 12px 24px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 50px;
            color: var(--text-secondary);
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.3s ease;
            font-family: 'Exo 2', sans-serif;
            letter-spacing: 0.5px;
        }

        .category-btn:hover {
            background: var(--surface-light);
            transform: translateY(-2px);
        }

        .category-btn.active {
            background: rgba(0, 217, 255, 0.1);
            border-color: var(--accent);
            color: var(--accent);
            box-shadow: 0 0 20px rgba(0, 217, 255, 0.2);
        }

        /* Tools grid */
        .tools-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 30px;
            margin-bottom: 60px;
        }

        .tool-card {
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 30px;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
        }

        .tool-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(0, 217, 255, 0.03) 0%, transparent 50%);
            z-index: -1;
        }

        .tool-card:hover {
            transform: translateY(-10px);
            border-color: rgba(0, 217, 255, 0.3);
            box-shadow: 
                0 15px 35px rgba(0, 0, 0, 0.3),
                0 0 0 1px rgba(0, 217, 255, 0.1);
        }

        .tool-header {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 20px;
        }

        .tool-icon {
            width: 70px;
            height: 70px;
            background: rgba(0, 217, 255, 0.1);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            flex-shrink: 0;
            border: 1px solid rgba(0, 217, 255, 0.2);
        }

        .tool-title-wrapper {
            flex: 1;
        }

        .tool-title {
            font-family: 'Exo 2', sans-serif;
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 5px;
            background: linear-gradient(90deg, #ffffff, var(--text-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .tool-category {
            display: inline-block;
            padding: 4px 12px;
            background: rgba(0, 217, 255, 0.1);
            color: var(--accent);
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .tool-description {
            color: var(--text-secondary);
            line-height: 1.7;
            margin-bottom: 25px;
            font-size: 0.95rem;
        }

        .tool-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .tool-link {
            padding: 12px 24px;
            background: linear-gradient(135deg, var(--accent), var(--accent-dark));
            color: var(--primary);
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
            font-family: 'Exo 2', sans-serif;
            letter-spacing: 0.5px;
        }

        .tool-link:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 217, 255, 0.3);
        }

        .tool-link i {
            transition: transform 0.3s ease;
        }

        .tool-link:hover i {
            transform: translateX(5px);
        }

        /* Language availability indicator */
        .tool-languages {
            display: flex;
            gap: 5px;
            margin-top: 15px;
        }

        .language-indicator {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
            font-weight: bold;
            cursor: help;
            transition: transform 0.3s ease;
        }

        .language-indicator:hover {
            transform: scale(1.2);
        }

        .language-en {
            background: rgba(59, 130, 246, 0.2);
            color: #3b82f6;
            border: 1px solid rgba(59, 130, 246, 0.4);
        }

        .language-ja {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.4);
        }

        .language-zh {
            background: rgba(16, 185, 129, 0.2);
            color: #10b981;
            border: 1px solid rgba(16, 185, 129, 0.4);
        }

        /* Empty state */
        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 80px 20px;
        }

        .empty-icon {
            font-size: 60px;
            color: var(--text-muted);
            margin-bottom: 25px;
            opacity: 0.5;
        }

        .empty-state h3 {
            font-family: 'Exo 2', sans-serif;
            font-size: 1.8rem;
            margin-bottom: 15px;
            color: var(--text-primary);
        }

        .empty-state p {
            color: var(--text-muted);
            max-width: 400px;
            margin: 0 auto;
            line-height: 1.6;
        }

        /* Footer */
        .main-footer {
            text-align: center;
            padding: 40px 20px;
            border-top: 1px solid var(--border);
            margin-top: 40px;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .footer-glow {
            height: 1px;
            width: 100%;
            background: linear-gradient(90deg, transparent, var(--accent), transparent);
            margin-bottom: 30px;
            opacity: 0.3;
        }

        /* Stats bar */
        .stats-bar {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-bottom: 40px;
            flex-wrap: wrap;
        }

        .stat-item {
            text-align: center;
        }

        .stat-value {
            font-family: 'Exo 2', sans-serif;
            font-size: 2.2rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent), #ffffff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1;
        }

        .stat-label {
            color: var(--text-secondary);
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 5px;
        }

        /* Canvas for particles */
        #particle-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        /* Responsive */
        @media (max-width: 1200px) {
            .tools-grid {
                grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            }
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2.8rem;
            }
            
            .tools-grid {
                grid-template-columns: 1fr;
            }
            
            .categories {
                justify-content: flex-start;
                overflow-x: auto;
                padding-bottom: 15px;
            }
            
            .tool-header {
                flex-direction: column;
                text-align: center;
            }
            
            .tool-icon {
                width: 80px;
                height: 80px;
                font-size: 36px;
            }
            
            .language-selector {
                position: relative;
                top: 0;
                right: 0;
                margin-bottom: 20px;
                display: flex;
                justify-content: center;
            }
        }

        @media (max-width: 480px) {
            h1 {
                font-size: 2.2rem;
            }
            
            .container {
                padding: 0 15px;
            }
            
            .tool-card {
                padding: 25px;
            }
            
            .tool-footer {
                flex-direction: column;
                gap: 15px;
                align-items: stretch;
            }
            
            .tool-link {
                justify-content: center;
            }
        }
    </style>
</head>

    <!-- Canvas for particles -->
    <canvas id="particle-canvas"></canvas>
    
    <div class="container">
        <!-- Language Selector -->
        <div class="language-selector">
            <div class="language-dropdown">
                <button class="language-btn">

            <div class="stats-bar">

            <div class="search-container">

                        <div class="search-hint">

                    </div>
                </div>
            </div>
            
            <div class="categories" id="categories-container">
                <!-- Categories will be populated by JavaScript -->
            </div>
        </header>
        
        <main>
            <div class="tools-grid" id="tools-container">
                <!-- Tools will be populated by JavaScript -->
            </div>
        </main>
        
        <footer class="main-footer">
            <div class="footer-glow"></div>
            <p id="footer-text">Nexus Tools Interface &copy; <span id="current-year"></span> | Edit HTML to modify tools</p>
        </footer>
    </div>

        // ======================
        // APPLICATION CODE
        // ======================
        // DOM Elements
        const categoriesContainer = document.getElementById('categories-container');
        const toolsContainer = document.getElementById('tools-container');
        const searchInput = document.getElementById('search-input');
        const currentYear = document.getElementById('current-year');
        const totalToolsElement = document.getElementById('total-tools');
        const activeCategoryCountElement = document.getElementById('active-category-count');
        const categoriesCountElement = document.getElementById('categories-count');
        const currentLanguageElement = document.getElementById('current-language');
        const currentFlagElement = document.getElementById('current-flag');
        const appTitleElement = document.getElementById('app-title');
        const appSubtitleElement = document.getElementById('app-subtitle');
        const searchHintTextElement = document.getElementById('search-hint-text');
        const footerTextElement = document.getElementById('footer-text');
        const statsTotalElement = document.getElementById('stats-total');
        const statsInCategoryElement = document.getElementById('stats-in-category');
        const statsCategoriesElement = document.getElementById('stats-categories');
        
        // State
        let activeCategory = 'all';
        let searchQuery = '';
        let currentLanguage = 'en'; // Default language
        
        // ======================
        // ENHANCED PARTICLE SYSTEM
        // ======================
        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        let connections = [];
        let animationFrameId;
        
        // Particle system configuration - ENHANCED FOR VISIBLE CONNECTIONS
        const PARTICLE_CONFIG = {
            count: 40, // Increased for more connections
            speed: 2, // Faster movement
            connectionDistance: 80, // Increased connection range
            lineWidth: 1.5, // Much thicker lines
            lineOpacity: 0.7, // Much more opaque
            lineGlow: false, // Add glow effect
            particleSize: 1.5, // Slightly larger particles
            particleGlow: 0.4, // Brighter particles
            newLineFadeIn: 0.1, // Speed for new lines to fade in
            linePulseSpeed: 0.1 // Slower pulsing for stability
        };
        
        // Initialize the application
        document.addEventListener('DOMContentLoaded', () => {
            // Set current year in footer
            currentYear.textContent = new Date().getFullYear();
            
            // Load saved language preference
            const savedLanguage = localStorage.getItem('nexusToolsLanguage') || 'en';
            setLanguage(savedLanguage);
            
            // Initialize stats
            updateStats();
            
            // Initialize categories
            initCategories();
            
            // Initialize tools
            initTools();
            
            // Setup event listeners
            setupEventListeners();
            
            // Setup language selector
            setupLanguageSelector();
            
            // Initialize particle system
            initParticleSystem();
            
            // Start animation
            animate();
        });
        
        // Initialize particle system
        function initParticleSystem() {
            // Set canvas size
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);
            
            // Create particles
            particles = [];
            for (let i = 0; i < PARTICLE_CONFIG.count; i++) {
                particles.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    vx: (Math.random() - 0.5) * PARTICLE_CONFIG.speed,
                    vy: (Math.random() - 0.5) * PARTICLE_CONFIG.speed,
                    size: PARTICLE_CONFIG.particleSize * (0.8 + Math.random() * 0.4),
                    color: `rgba(0, 217, 255, ${0.3 + Math.random() * 0.3})`,
                    glow: PARTICLE_CONFIG.particleGlow * (0.8 + Math.random() * 0.4),
                    connections: []
                });
            }
            
            // Create initial connections
            createConnections();
        }
        
        // Resize canvas
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        
        // Create connections between nearby particles
        function createConnections() {
            connections = [];
            
            for (let i = 0; i < particles.length; i++) {
                for (let j = i + 1; j < particles.length; j++) {
                    const dx = particles[i].x - particles[j].x;
                    const dy = particles[i].y - particles[j].y;
                    const distance = Math.sqrt(dx * dx + dy * dy);
                    
                    if (distance < PARTICLE_CONFIG.connectionDistance) {
                        const opacity = PARTICLE_CONFIG.lineOpacity * (1 - distance / PARTICLE_CONFIG.connectionDistance);
                        connections.push({
                            from: i,
                            to: j,
                            distance: distance,
                            opacity: opacity,
                            currentOpacity: 0, // Start at 0 for fade-in effect
                            width: PARTICLE_CONFIG.lineWidth * (0.8 + Math.random() * 0.4),
                            pulsePhase: Math.random() * Math.PI * 2
                        });
                    }
                }
            }
        }
        
        // Animation loop
        function animate() {
            // Clear canvas with dark background
            ctx.fillStyle = 'rgba(10, 14, 23, 0.1)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Update and draw particles
            updateParticles();
            
            // Update and draw connections
            updateConnections();
            
            // Create new connections dynamically
            createDynamicConnections();
            
            // Continue animation
            animationFrameId = requestAnimationFrame(animate);
        }
        
        // Update particles
        function updateParticles() {
            for (let i = 0; i < particles.length; i++) {
                const p = particles[i];
                
                // Update position
                p.x += p.vx;
                p.y += p.vy;
                
                // Bounce off edges
                if (p.x < 0 || p.x > canvas.width) p.vx *= -1;
                if (p.y < 0 || p.y > canvas.height) p.vy *= -1;
                
                // Keep in bounds
                p.x = Math.max(0, Math.min(canvas.width, p.x));
                p.y = Math.max(0, Math.min(canvas.height, p.y));
                
                // Draw particle with enhanced glow
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                
                // Particle glow effect
                const gradient = ctx.createRadialGradient(
                    p.x, p.y, 0,
                    p.x, p.y, p.size * 3
                );
                gradient.addColorStop(0, p.color);
                gradient.addColorStop(0.7, `rgba(0, 217, 255, ${p.glow * 0.3})`);
                gradient.addColorStop(1, 'rgba(0, 217, 255, 0)');
                
                ctx.fillStyle = gradient;
                ctx.fill();
                
                // Bright core
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size * 0.6, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
                ctx.fill();
            }
        }
        
        // Update connections with enhanced visibility
        function updateConnections() {
            for (let i = 0; i < connections.length; i++) {
                const conn = connections[i];
                const p1 = particles[conn.from];
                const p2 = particles[conn.to];
                
                // Update fade-in for new connections
                if (conn.currentOpacity < conn.opacity) {
                    conn.currentOpacity = Math.min(conn.opacity, conn.currentOpacity + PARTICLE_CONFIG.newLineFadeIn);
                }
                
                // Update pulse animation
                conn.pulsePhase += PARTICLE_CONFIG.linePulseSpeed;
                const pulse = Math.sin(conn.pulsePhase) * 0.2 + 0.8;
                
                // Calculate current opacity with pulse
                const currentOpacity = conn.currentOpacity * pulse;
                
                // Calculate line color - BRIGHTER AND MORE VISIBLE
                const lineColor = `rgba(0, 217, 255, ${currentOpacity})`;
                const glowColor = `rgba(0, 217, 255, ${currentOpacity * 0.4})`;
                
                // Draw line glow (thicker, softer line)
                if (PARTICLE_CONFIG.lineGlow) {
                    ctx.beginPath();
                    ctx.moveTo(p1.x, p1.y);
                    ctx.lineTo(p2.x, p2.y);
                    ctx.lineWidth = conn.width + 6;
                    ctx.strokeStyle = glowColor;
                    ctx.lineCap = 'round';
                    ctx.stroke();
                }
                
                // Draw main line - THICK AND BRIGHT
                ctx.beginPath();
                ctx.moveTo(p1.x, p1.y);
                ctx.lineTo(p2.x, p2.y);
                ctx.lineWidth = conn.width;
                ctx.strokeStyle = lineColor;
                ctx.lineCap = 'round';
                ctx.stroke();
                
                // Draw bright inner line for extra visibility
                ctx.beginPath();
                ctx.moveTo(p1.x, p1.y);
                ctx.lineTo(p2.x, p2.y);
                ctx.lineWidth = conn.width * 0.4;
                ctx.strokeStyle = `rgba(255, 255, 255, ${currentOpacity * 0.9})`;
                ctx.lineCap = 'round';
                ctx.stroke();
            }
        }
        
        // Create dynamic connections for particles that come close
        function createDynamicConnections() {
            // Check for new connections every few frames
            if (Math.random() < 0.3) {
                for (let i = 0; i < particles.length; i++) {
                    for (let j = i + 1; j < particles.length; j++) {
                        // Skip if already connected
                        let alreadyConnected = connections.some(conn => 
                            (conn.from === i && conn.to === j) || (conn.from === j && conn.to === i)
                        );
                        
                        if (!alreadyConnected) {
                            const dx = particles[i].x - particles[j].x;
                            const dy = particles[i].y - particles[j].y;
                            const distance = Math.sqrt(dx * dx + dy * dy);
                            
                            if (distance < PARTICLE_CONFIG.connectionDistance * 0.8) {
                                const opacity = PARTICLE_CONFIG.lineOpacity * (1 - distance / PARTICLE_CONFIG.connectionDistance);
                                connections.push({
                                    from: i,
                                    to: j,
                                    distance: distance,
                                    opacity: opacity,
                                    currentOpacity: 0, // Start faded in
                                    width: PARTICLE_CONFIG.lineWidth * (0.8 + Math.random() * 0.4),
                                    pulsePhase: Math.random() * Math.PI * 2
                                });
                            }
                        }
                    }
                }
            }
        }
        
        // Set current language
        function setLanguage(lang) {
            currentLanguage = lang;
            localStorage.setItem('nexusToolsLanguage', lang);
            
            // Update UI text
            updateUIText();
            
            // Update body data attribute for font switching
            document.body.setAttribute('data-language', lang);
            
            // Update active language option
            document.querySelectorAll('.language-option').forEach(option => {
                option.classList.remove('active');
                if (option.dataset.lang === lang) {
                    option.classList.add('active');
                }
            });
            
            // Update language selector
            const langData = {
                en: { name: 'English', flag: '🇺🇸' },
                ja: { name: '日本語', flag: '🇯🇵' },
                zh: { name: '中文', flag: '🇨🇳' }
            };
            
            currentLanguageElement.textContent = langData[lang].name;
            currentFlagElement.textContent = langData[lang].flag;
            
            // Re-render categories and tools
            initCategories();
            initTools();
            updateStats();
        }
        
        // Update UI text based on current language
        function updateUIText() {
            const t = i18n[currentLanguage];
            
            appTitleElement.textContent = t.appTitle;
            appSubtitleElement.textContent = t.appSubtitle;
            searchInput.placeholder = t.searchPlaceholder;
            searchHintTextElement.textContent = t.searchHint;
            statsTotalElement.textContent = t.statsTotal;
            statsInCategoryElement.textContent = t.statsInCategory;
            statsCategoriesElement.textContent = t.statsCategories;
            footerTextElement.textContent = t.footerText.replace('{year}', new Date().getFullYear());
        }
        
        // Get text for current language
        function getText(textObj) {
            return textObj[currentLanguage] || textObj.en || Object.values(textObj)[0];
        }
        
        // Setup language selector
        function setupLanguageSelector() {
            document.querySelectorAll('.language-option').forEach(option => {
                option.addEventListener('click', () => {
                    const lang = option.dataset.lang;
                    setLanguage(lang);
                });
            });
        }
        
        // Update statistics
        function updateStats() {
            // Filter tools by current language
            const filteredByLanguage = toolsData.filter(tool => 
                tool.languages.includes(currentLanguage)
            );
            
            totalToolsElement.textContent = filteredByLanguage.length;
            categoriesCountElement.textContent = categories.length - 1; // Excluding "All"
            
            // Calculate active category count
            let activeCount = filteredByLanguage.length;
            if (activeCategory !== 'all') {
                activeCount = filteredByLanguage.filter(tool => tool.category === activeCategory).length;
            }
            if (searchQuery) {
                const query = searchQuery.toLowerCase();
                activeCount = filteredByLanguage.filter(tool => {
                    if (activeCategory !== 'all' && tool.category !== activeCategory) return false;
                    const name = getText(tool.name).toLowerCase();
                    const description = getText(tool.description).toLowerCase();
                    return name.includes(query) || description.includes(query);
                }).length;
            }
            activeCategoryCountElement.textContent = activeCount;
        }
        
        // Initialize categories
        function initCategories() {
            categoriesContainer.innerHTML = '';
            
            categories.forEach(category => {
                const button = document.createElement('button');
                button.className = `category-btn ${category.id === activeCategory ? 'active' : ''}`;
                button.dataset.category = category.id;
                button.style.borderColor = category.id === activeCategory ? category.color : '';
                button.innerHTML = `
                    <span class="category-emoji">${category.emoji}</span>
                    <span class="category-name">${getText(category.name)}</span>
                `;
                
                button.addEventListener('click', () => {
                    // Update active category
                    activeCategory = category.id;
                    
                    // Update UI
                    document.querySelectorAll('.category-btn').forEach(btn => {
                        btn.classList.remove('active');
                        btn.style.borderColor = '';
                    });
                    button.classList.add('active');
                    button.style.borderColor = category.color;
                    
                    // Re-render tools
                    initTools();
                    updateStats();
                });
                
                categoriesContainer.appendChild(button);
            });
        }
        
        // Initialize tools
        function initTools() {
            toolsContainer.innerHTML = '';
            
            // First filter by language
            let filteredTools = toolsData.filter(tool => 
                tool.languages.includes(currentLanguage)
            );
            
            // Then filter by category
            if (activeCategory !== 'all') {
                filteredTools = filteredTools.filter(tool => tool.category === activeCategory);
            }
            
            // Then filter by search query
            if (searchQuery) {
                const query = searchQuery.toLowerCase();
                filteredTools = filteredTools.filter(tool => {
                    const name = getText(tool.name).toLowerCase();
                    const description = getText(tool.description).toLowerCase();
                    return name.includes(query) || description.includes(query);
                });
            }
            
            // Display tools or empty state
            if (filteredTools.length === 0) {
                const emptyState = document.createElement('div');
                emptyState.className = 'empty-state';
                
                const t = i18n[currentLanguage];
                const message = searchQuery ? t.tryDifferentSearch : t.noToolsInCategory;
                
                emptyState.innerHTML = `
                    <div class="empty-icon">
                        <i class="fas fa-search-minus"></i>
                    </div>
                    <h3>${t.noToolsFound}</h3>
                    <p>${message}</p>
                `;
                toolsContainer.appendChild(emptyState);
            } else {
                filteredTools.forEach(tool => {
                    const category = categories.find(c => c.id === tool.category);
                    const toolElement = createToolElement(tool, category);
                    toolsContainer.appendChild(toolElement);
                });
            }
            
            updateStats();
        }
        
        // Create tool element
        function createToolElement(tool, category) {
            const card = document.createElement('div');
            card.className = 'tool-card';
            
            // Convert hex color to rgb for rgba
            const hexToRgb = (hex) => {
                const r = parseInt(hex.slice(1, 3), 16);
                const g = parseInt(hex.slice(3, 5), 16);
                const b = parseInt(hex.slice(5, 7), 16);
                return `${r}, ${g}, ${b}`;
            };
            
            const t = i18n[currentLanguage];
            
            card.innerHTML = `
                <div class="tool-header">
                    <div class="tool-icon">${tool.emoji}</div>
                    <div class="tool-title-wrapper">
                        <h3 class="tool-title">${getText(tool.name)}</h3>
                        <div class="tool-category" style="background: rgba(${hexToRgb(category.color)}, 0.1); color: ${category.color}">${getText(category.name)}</div>
                    </div>
                </div>
                <p class="tool-description">${getText(tool.description)}</p>
                <div class="tool-languages">
                    ${tool.languages.includes('en') ? '<div class="language-indicator language-en" title="Available in English">EN</div>' : ''}
                    ${tool.languages.includes('ja') ? '<div class="language-indicator language-ja" title="日本語で利用可能">JA</div>' : ''}
                    ${tool.languages.includes('zh') ? '<div class="language-indicator language-zh" title="可用中文">ZH</div>' : ''}
                </div>
                <div class="tool-footer">
                    <a href="${tool.link}" class="tool-link" target="_blank">
                        <span>${t.openTool}</span>
                        <i class="fas fa-arrow-right"></i>
                    </a>
                </div>
            `;
            
            return card;
        }
        
        // Setup event listeners
        function setupEventListeners() {
            // Search functionality
            searchInput.addEventListener('input', (e) => {
                searchQuery = e.target.value;
                initTools();
            });
            
            // Clear search on escape key
            searchInput.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    searchInput.value = '';
                    searchQuery = '';
                    initTools();
                }
            });
            
            // Reinitialize on window resize
            window.addEventListener('resize', () => {
                resizeCanvas();
                initTools();
            });
            
            // Clean up animation on page unload
            window.addEventListener('beforeunload', () => {
                if (animationFrameId) {
                    cancelAnimationFrame(animationFrameId);
                }
            });
        }
        
        // Log data structure for easy editing reference
        console.log('🔧 Nexus Tools Interface (Multi-language)');
        console.log('Enhanced Particle System: Lines are now highly visible');
        console.log('Current language:', currentLanguage);
    </script>
</body>
</html>
