<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图形排版计算器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }
        .subtitle {
            opacity: 0.9;
            font-size: 14px;
        }
        .content {
            display: flex;
            flex-wrap: wrap;
        }
        .controls {
            flex: 1;
            min-width: 320px;
            padding: 30px;
            background: #f8f9fa;
            border-right: 1px solid #e0e0e0;
        }
        .preview {
            flex: 2;
            min-width: 400px;
            padding: 30px;
            display: flex;
            flex-direction: column;
        }
        .form-group {
            margin-bottom: 25px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
            font-size: 14px;
        }
        input, select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: all 0.3s;
        }
        input:focus, select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        .btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        .info-box {
            background: #e3f2fd;
            border-left: 4px solid #2196f3;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
        }
        .info-box h3 {
            color: #1976d2;
            margin-bottom: 10px;
            font-size: 16px;
        }
        .info-item {
            display: flex;
            justify-content: space-between;
            padding: 5px 0;
            font-size: 14px;
        }
        .info-label {
            color: #666;
        }
        .info-value {
            font-weight: 600;
            color: #333;
        }
        .canvas-container {
            flex: 1;
            background: white;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            position: relative;
            overflow: hidden;
            min-height: 500px;
        }
        .title-area {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            background: rgba(255, 255, 255, 0.95);
            border-bottom: 2px dashed #ccc;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: 600;
            color: #666;
            z-index: 10;
        }
        #canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        @media (max-width: 768px) {
            .content {
                flex-direction: column;
            }
            .controls {
                border-right: none;
                border-bottom: 1px solid #e0e0e0;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📐 图形排版计算器</h1>
            <p class="subtitle">智能计算最佳图形尺寸与排列方式</p>
        </div>
        <div class="content">
            <div class="controls">
                <div class="form-group">
                    <label>纸张尺寸</label>
                    <select id="paperSize">
                        <option value="a4">A4 (210×297mm)</option>
                        <option value="a3">A3 (297×420mm)</option>
                        <option value="a5">A5 (148×210mm)</option>
                        <option value="letter">Letter (216×279mm)</option>
                        <option value="custom">自定义尺寸</option>
                    </select>
                </div>
                <div class="form-group" id="customSizeGroup" style="display:none;">
                    <label>宽度 (mm)</label>
                    <input type="number" id="customWidth" value="210" min="50">
                    <label style="margin-top:10px;">高度 (mm)</label>
                    <input type="number" id="customHeight" value="297" min="50">
                </div>
                <div class="form-group">
                    <label>标题区域高度 (mm)</label>
                    <input type="number" id="titleHeight" value="30" min="0" max="100">
                </div>
                <div class="form-group">
                    <label>图形类型</label>
                    <select id="shapeType">
                        <option value="circle">圆形</option>
                        <option value="square">正方形</option>
                        <option value="rectangle">长方形</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>图形数量</label>
                    <input type="number" id="shapeCount" value="25" min="1" max="100">
                </div>
                <div class="form-group">
                    <label>边距 (mm)</label>
                    <input type="number" id="margin" value="10" min="0" max="50">
                </div>
                <div class="form-group">
                    <label>图形间距 (mm)</label>
                    <input type="number" id="spacing" value="5" min="0" max="30">
                </div>
                <button class="btn" onclick="calculate()">计算并生成</button>
                
                <div class="info-box" id="resultInfo" style="display:none; margin-top:20px;">
                    <h3>📊 计算结果</h3>
                    <div class="info-item">
                        <span class="info-label">排列方式:</span>
                        <span class="info-value" id="layoutInfo">-</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">图形尺寸:</span>
                        <span class="info-value" id="sizeInfo">-</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">可用区域:</span>
                        <span class="info-value" id="areaInfo">-</span>
                    </div>
                </div>
            </div>
            <div class="preview">
                <div class="canvas-container" id="canvasContainer">
                    <div class="title-area" id="titleArea">标题区域</div>
                    <canvas id="canvas"></canvas>
                </div>
            </div>
        </div>
    </div>

    <script>
        const paperSizes = {
            a4: { width: 210, height: 297 },
            a3: { width: 297, height: 420 },
            a5: { width: 148, height: 210 },
            letter: { width: 216, height: 279 }
        };

        document.getElementById('paperSize').addEventListener('change', function() {
            const customGroup = document.getElementById('customSizeGroup');
            if (this.value === 'custom') {
                customGroup.style.display = 'block';
            } else {
                customGroup.style.display = 'none';
            }
        });

        function getPaperSize() {
            const paperSize = document.getElementById('paperSize').value;
            if (paperSize === 'custom') {
                return {
                    width: parseFloat(document.getElementById('customWidth').value),
                    height: parseFloat(document.getElementById('customHeight').value)
                };
            }
            return paperSizes[paperSize];
        }

        function findBestLayout(count) {
            let bestCols = 1;
            let bestRows = count;
            let minDiff = Math.abs(bestCols - bestRows);

            for (let cols = 1; cols <= count; cols++) {
                let rows = Math.ceil(count / cols);
                let diff = Math.abs(cols - rows);
                if (diff < minDiff) {
                    minDiff = diff;
                    bestCols = cols;
                    bestRows = rows;
                }
            }
            return { cols: bestCols, rows: bestRows };
        }

        function calculate() {
            const paper = getPaperSize();
            const titleHeight = parseFloat(document.getElementById('titleHeight').value);
            const shapeType = document.getElementById('shapeType').value;
            const count = parseInt(document.getElementById('shapeCount').value);
            const margin = parseFloat(document.getElementById('margin').value);
            const spacing = parseFloat(document.getElementById('spacing').value);

            const availableHeight = paper.height - titleHeight - 2 * margin;
            const availableWidth = paper.width - 2 * margin;

            const layout = findBestLayout(count);
            const cols = layout.cols;
            const rows = layout.rows;

            let shapeWidth, shapeHeight;

            if (shapeType === 'circle') {
                const maxWidth = (availableWidth - (cols - 1) * spacing) / cols;
                const maxHeight = (availableHeight - (rows - 1) * spacing) / rows;
                const diameter = Math.min(maxWidth, maxHeight);
                shapeWidth = shapeHeight = diameter;
            } else if (shapeType === 'square') {
                const maxWidth = (availableWidth - (cols - 1) * spacing) / cols;
                const maxHeight = (availableHeight - (rows - 1) * spacing) / rows;
                const side = Math.min(maxWidth, maxHeight);
                shapeWidth = shapeHeight = side;
            } else {
                shapeWidth = (availableWidth - (cols - 1) * spacing) / cols;
                shapeHeight = (availableHeight - (rows - 1) * spacing) / rows;
            }

            drawCanvas(paper, titleHeight, margin, spacing, shapeType, cols, rows, shapeWidth, shapeHeight, count);

            document.getElementById('resultInfo').style.display = 'block';
            document.getElementById('layoutInfo').textContent = `${cols}列 × ${rows}行`;
            if (shapeType === 'circle') {
                document.getElementById('sizeInfo').textContent = `直径 ${shapeWidth.toFixed(1)}mm`;
            } else {
                document.getElementById('sizeInfo').textContent = `${shapeWidth.toFixed(1)}×${shapeHeight.toFixed(1)}mm`;
            }
            document.getElementById('areaInfo').textContent = `${availableWidth.toFixed(1)}×${availableHeight.toFixed(1)}mm`;
        }

        function drawCanvas(paper, titleHeight, margin, spacing, shapeType, cols, rows, shapeWidth, shapeHeight, count) {
            const canvas = document.getElementById('canvas');
            const ctx = canvas.getContext('2d');
            const container = document.getElementById('canvasContainer');
            const titleArea = document.getElementById('titleArea');

            const scale = 2;
            const displayWidth = container.clientWidth;
            const displayHeight = container.clientHeight;
            const aspectRatio = paper.width / paper.height;

            let canvasDisplayWidth, canvasDisplayHeight;
            if (displayWidth / displayHeight > aspectRatio) {
                canvasDisplayHeight = displayHeight;
                canvasDisplayWidth = displayHeight * aspectRatio;
            } else {
                canvasDisplayWidth = displayWidth;
                canvasDisplayHeight = displayWidth / aspectRatio;
            }

            canvas.width = canvasDisplayWidth * scale;
            canvas.height = canvasDisplayHeight * scale;
            canvas.style.width = canvasDisplayWidth + 'px';
            canvas.style.height = canvasDisplayHeight + 'px';

            const mmToPx = canvas.width / paper.width;

            const titleHeightPx = titleHeight * mmToPx;
            titleArea.style.height = (titleHeightPx / scale) + 'px';

            ctx.scale(scale, scale);
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const startX = margin * mmToPx;
            const startY = (titleHeight + margin) * mmToPx;

            ctx.fillStyle = 'rgba(102, 126, 234, 0.3)';
            ctx.strokeStyle = '#667eea';
            ctx.lineWidth = 2;

            let drawn = 0;
            for (let row = 0; row < rows && drawn < count; row++) {
                for (let col = 0; col < cols && drawn < count; col++) {
                    const x = startX + col * (shapeWidth * mmToPx + spacing * mmToPx);
                    const y = startY + row * (shapeHeight * mmToPx + spacing * mmToPx);

                    if (shapeType === 'circle') {
                        const radius = (shapeWidth * mmToPx) / 2;
                        ctx.beginPath();
                        ctx.arc(x + radius, y + radius, radius, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.stroke();
                    } else {
                        ctx.fillRect(x, y, shapeWidth * mmToPx, shapeHeight * mmToPx);
                        ctx.strokeRect(x, y, shapeWidth * mmToPx, shapeHeight * mmToPx);
                    }
                    drawn++;
                }
            }
        }

        window.addEventListener('resize', calculate);
        window.addEventListener('load', calculate);
    </script>
</body>
</html>
